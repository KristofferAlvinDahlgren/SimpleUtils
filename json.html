<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON — Utils</title>
  <script>
    (function () {
      const saved = localStorage.getItem('utils-theme');
      const preferred = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = preferred;
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1e1e1e; --surface: #252526; --surface-hover: #2a2d2e;
      --surface-deep: #222222; --input-bg: #2d2d2d;
      --border: #3c3c3c; --accent: #0078d4; --accent-hover: #106ebe;
      --text: #d4d4d4; --text-dim: #888;
      --mono: 'Cascadia Code', Consolas, 'Courier New', monospace;
      --r: 5px; --success: #4ec9b0; --error: #f44747;
    }
    [data-theme="light"] {
      --bg: #f8f8f8; --surface: #ffffff; --surface-hover: #f0f0f0;
      --surface-deep: #ebebeb; --input-bg: #f5f5f5;
      --border: #d0d0d0; --accent: #0078d4; --accent-hover: #106ebe;
      --text: #1f1f1f; --text-dim: #767676;
      --success: #0e7a6e; --error: #c72e2e;
    }
    [data-theme="light"] .validation.ok  { border-color: #a8d4cc; }
    [data-theme="light"] .validation.err { border-color: #f5b8b8; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: grid; grid-template-rows: auto 1fr; overflow: hidden;
    }
    header {
      display: flex; align-items: center; gap: 16px;
      padding: 0 20px; height: 48px; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header a { color: var(--text-dim); text-decoration: none; font-size: 0.82rem; }
    header a:hover { color: var(--text); }
    header h1 { font-size: 1rem; font-weight: 600; }
    .header-spacer { flex: 1; }
    .theme-toggle {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; padding: 0;
      border: 1px solid var(--border); border-radius: var(--r);
      background: transparent; color: var(--text-dim);
      cursor: pointer; flex-shrink: 0;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .theme-toggle:hover { background: var(--surface-hover); color: var(--text); border-color: var(--accent); }
    .theme-toggle svg { display: block; pointer-events: none; }
    main {
      display: grid; grid-template-columns: 1fr 220px 1fr;
      min-height: 0; overflow: hidden;
    }
    .panel {
      display: flex; flex-direction: column;
      padding: 14px; gap: 10px; min-height: 0; overflow: hidden;
      border-right: 1px solid var(--border);
    }
    .panel:last-child { border-right: none; }
    .label {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-dim); flex-shrink: 0;
    }
    textarea {
      flex: 1; min-height: 0; resize: none;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); color: var(--text);
      font-family: var(--mono); font-size: 0.85rem; line-height: 1.65;
      padding: 10px 12px; outline: none; transition: border-color 0.15s;
    }
    textarea:focus { border-color: var(--accent); }
    textarea[readonly] { background: var(--surface-deep); cursor: default; }
    .options-panel {
      display: flex; flex-direction: column; gap: 16px;
      padding: 14px; overflow-y: auto; min-height: 0;
      border-right: 1px solid var(--border);
    }
    .opt-group { display: flex; flex-direction: column; gap: 8px; }
    .opt-title {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-dim);
      border-bottom: 1px solid var(--border); padding-bottom: 5px;
    }
    .opt-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; font-size: 0.83rem;
    }
    .opt-row label { cursor: pointer; user-select: none; }
    .opt-row label.radio-label {
      display: flex; align-items: center; gap: 6px; cursor: pointer;
    }
    input[type="checkbox"], input[type="radio"] {
      width: 14px; height: 14px; cursor: pointer;
      accent-color: var(--accent); flex-shrink: 0;
    }
    select {
      background: var(--input-bg); border: 1px solid var(--border); border-radius: var(--r);
      color: var(--text); padding: 3px 6px; font-size: 0.8rem; outline: none; cursor: pointer;
    }
    .validation {
      font-size: 0.78rem; line-height: 1.4; padding: 7px 9px;
      border-radius: var(--r); background: var(--surface-deep); border: 1px solid var(--border);
      word-break: break-word;
    }
    .validation.ok  { color: var(--success); border-color: #3a4a43; }
    .validation.err { color: var(--error);   border-color: #4a2a2a; }
    .validation.empty { color: var(--text-dim); }
    .status { font-size: 0.73rem; color: var(--text-dim); flex-shrink: 0; min-height: 1em; }
    .action-row { display: flex; gap: 8px; flex-shrink: 0; }
    .btn {
      flex: 1; padding: 7px 0; border-radius: var(--r); border: none;
      font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: background 0.15s, opacity 0.15s;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:not(:disabled):hover { background: var(--accent-hover); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:not(:disabled):hover { background: var(--surface-hover); }
    #format-opts { transition: opacity 0.15s; }
    #format-opts.hidden { opacity: 0.35; pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← Utils</a>
    <h1>JSON</h1>
    <div class="header-spacer"></div>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme"></button>
  </header>
  <main>
    <div class="panel">
      <span class="label">Input</span>
      <textarea id="input" placeholder='{"key": "value"}' spellcheck="false"></textarea>
    </div>

    <div class="options-panel">
      <div class="opt-group">
        <div class="opt-title">Mode</div>
        <div class="opt-row">
          <label class="radio-label">
            <input type="radio" name="mode" value="format" checked> Format
          </label>
        </div>
        <div class="opt-row">
          <label class="radio-label">
            <input type="radio" name="mode" value="minify"> Minify
          </label>
        </div>
        <div class="opt-row">
          <label class="radio-label">
            <input type="radio" name="mode" value="yaml"> → YAML
          </label>
        </div>
        <div class="opt-row">
          <label class="radio-label">
            <input type="radio" name="mode" value="xml"> → XML
          </label>
        </div>
        <div class="opt-row">
          <label class="radio-label">
            <input type="radio" name="mode" value="toml"> → TOML
          </label>
        </div>
        <div class="opt-row">
          <label class="radio-label">
            <input type="radio" name="mode" value="csv"> → CSV
          </label>
        </div>
      </div>

      <div class="opt-group" id="format-opts">
        <div class="opt-title">Format options</div>
        <div class="opt-row">
          <label for="indent">Indent</label>
          <select id="indent">
            <option value="2">2 spaces</option>
            <option value="4">4 spaces</option>
            <option value="tab">Tab</option>
          </select>
        </div>
        <div class="opt-row">
          <label for="sort-keys">Sort keys</label>
          <input type="checkbox" id="sort-keys">
        </div>
      </div>

      <div class="opt-group">
        <div class="opt-title">Validation</div>
        <div id="validation" class="validation empty">No input</div>
      </div>
    </div>

    <div class="panel">
      <span class="label">Output</span>
      <textarea id="output" readonly placeholder="Output appears here…" spellcheck="false"></textarea>
      <div id="status" class="status"></div>
      <div class="action-row">
        <button class="btn btn-ghost" id="btn-copy" disabled>Copy</button>
        <button class="btn btn-primary" id="btn-commit" disabled title="Replace input with output">Commit</button>
      </div>
    </div>
  </main>

  <script>
    const inputEl     = document.getElementById('input');
    const outputEl    = document.getElementById('output');
    const statusEl    = document.getElementById('status');
    const validEl     = document.getElementById('validation');
    const formatOpts  = document.getElementById('format-opts');
    const indentSel   = document.getElementById('indent');
    const sortKeysEl  = document.getElementById('sort-keys');
    const btnCopy     = document.getElementById('btn-copy');
    const btnCommit   = document.getElementById('btn-commit');

    function deepSortKeys(val) {
      if (Array.isArray(val)) return val.map(deepSortKeys);
      if (val !== null && typeof val === 'object') {
        return Object.fromEntries(
          Object.keys(val).sort().map(k => [k, deepSortKeys(val[k])])
        );
      }
      return val;
    }

    // ── Converters ────────────────────────────────────────────────────────────

    function jsonToYaml(data) {
      function quoteStr(s, depth) {
        if (s === '') return '""';
        if (s.includes('\n')) {
          const ind = '  '.repeat(depth + 1);
          return '|\n' + s.split('\n').map(l => ind + l).join('\n');
        }
        const needsQuotes =
          s === 'true' || s === 'false' || s === 'null' || s === '~' ||
          /^[\s]|[\s]$/.test(s) ||
          /^[-?:,#&*!|>'"\\%@`\[\]{}~]/.test(s) ||
          /[:#\[\]{},]/.test(s) ||
          /^[0-9]/.test(s) ||
          /^0x[0-9a-fA-F]+$/i.test(s) ||
          /^[+-]?(\.inf|\.nan)$/i.test(s);
        return needsQuotes ? JSON.stringify(s) : s;
      }
      function serialize(val, depth) {
        const pad = '  '.repeat(depth);
        if (val === null) return 'null';
        if (typeof val === 'boolean') return String(val);
        if (typeof val === 'number') return isFinite(val) ? String(val) : '.nan';
        if (typeof val === 'string') return quoteStr(val, depth);
        if (Array.isArray(val)) {
          if (val.length === 0) return '[]';
          return val.map(item => {
            if (item !== null && typeof item === 'object' && !Array.isArray(item)) {
              const inner = serialize(item, depth + 1);
              const lines = inner.split('\n');
              return pad + '- ' + lines[0].trimStart() +
                (lines.length > 1 ? '\n' + lines.slice(1).join('\n') : '');
            }
            if (Array.isArray(item)) return pad + '-\n' + serialize(item, depth + 1);
            return pad + '- ' + serialize(item, depth);
          }).join('\n');
        }
        if (typeof val === 'object') {
          const keys = Object.keys(val);
          if (keys.length === 0) return '{}';
          return keys.map(key => {
            const v = val[key];
            const sk = /[\s:#\[\]{},&*?|<>='"\n\\%@`!]/.test(key) || key === ''
              ? JSON.stringify(key) : key;
            if (v !== null && typeof v === 'object')
              return pad + sk + ':\n' + serialize(v, depth + 1);
            return pad + sk + ': ' + serialize(v, depth);
          }).join('\n');
        }
        return String(val);
      }
      return serialize(data, 0);
    }

    function jsonToXml(data) {
      function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
      }
      function safeTag(s) {
        let t = String(s).replace(/[^a-zA-Z0-9_\-.]/g, '_');
        if (/^[^a-zA-Z_]/.test(t)) t = '_' + t;
        return t || '_';
      }
      function serialize(val, tag, depth) {
        const pad = '  '.repeat(depth);
        if (val === null || val === undefined) return `${pad}<${tag}/>`;
        if (Array.isArray(val)) {
          if (val.length === 0) return `${pad}<${tag}/>`;
          return `${pad}<${tag}>\n` +
            val.map(item => serialize(item, 'item', depth + 1)).join('\n') +
            `\n${pad}</${tag}>`;
        }
        if (typeof val === 'object') {
          const entries = Object.entries(val);
          if (entries.length === 0) return `${pad}<${tag}/>`;
          return `${pad}<${tag}>\n` +
            entries.map(([k, v]) => serialize(v, safeTag(k), depth + 1)).join('\n') +
            `\n${pad}</${tag}>`;
        }
        return `${pad}<${tag}>${esc(val)}</${tag}>`;
      }
      return '<?xml version="1.0" encoding="UTF-8"?>\n' + serialize(data, 'root', 0);
    }

    function jsonToToml(data) {
      if (typeof data !== 'object' || data === null || Array.isArray(data))
        throw new Error('TOML root must be a JSON object');
      function tomlKey(k) {
        return /^[a-zA-Z0-9_-]+$/.test(k) ? k : JSON.stringify(k);
      }
      function tomlScalar(v) {
        if (v === null) return '""';
        if (typeof v === 'boolean') return String(v);
        if (typeof v === 'number') return isFinite(v) ? String(v) : '"' + v + '"';
        if (typeof v === 'string') return JSON.stringify(v);
        return JSON.stringify(String(v));
      }
      function tomlInline(v) {
        if (v === null || typeof v !== 'object') return tomlScalar(v);
        if (Array.isArray(v)) return '[' + v.map(tomlInline).join(', ') + ']';
        return '{' + Object.entries(v).map(([k, w]) => tomlKey(k) + ' = ' + tomlInline(w)).join(', ') + '}';
      }
      function isTableArr(a) {
        return Array.isArray(a) && a.length > 0 &&
          a.every(x => x !== null && typeof x === 'object' && !Array.isArray(x));
      }
      function buildSection(obj, path) {
        const simple = [], tables = [], arrs = [];
        for (const [k, v] of Object.entries(obj)) {
          if (v !== null && typeof v === 'object' && !Array.isArray(v)) tables.push([k, v]);
          else if (isTableArr(v)) arrs.push([k, v]);
          else simple.push(tomlKey(k) + ' = ' + tomlInline(v));
        }
        const parts = [];
        if (simple.length) parts.push(simple.join('\n'));
        for (const [k, v] of tables) {
          const p = [...path, k], h = p.map(tomlKey).join('.');
          parts.push('[' + h + ']\n' + buildSection(v, p).trim());
        }
        for (const [k, v] of arrs) {
          const p = [...path, k], h = p.map(tomlKey).join('.');
          for (const item of v)
            parts.push('[[' + h + ']]\n' + buildSection(item, p).trim());
        }
        return parts.join('\n\n');
      }
      return buildSection(data, []).trim();
    }

    function jsonToCsv(data) {
      if (!Array.isArray(data)) throw new Error('CSV requires a JSON array as root');
      if (data.length === 0) return '';
      function esc(v) {
        if (v === null || v === undefined) return '';
        const s = typeof v === 'object' ? JSON.stringify(v) : String(v);
        return (s.includes(',') || s.includes('"') || s.includes('\n') || s.includes('\r'))
          ? '"' + s.replace(/"/g, '""') + '"' : s;
      }
      if (data.every(r => r !== null && typeof r === 'object' && !Array.isArray(r))) {
        const headers = [...new Set(data.flatMap(r => Object.keys(r)))];
        return [headers.map(esc).join(','),
          ...data.map(r => headers.map(h => esc(r[h] === undefined ? null : r[h])).join(','))
        ].join('\n');
      }
      if (data.every(r => Array.isArray(r)))
        return data.map(r => r.map(esc).join(',')).join('\n');
      if (data.every(r => typeof r !== 'object' || r === null))
        return data.map(esc).join('\n');
      throw new Error('CSV: mixed array items are not supported');
    }

    function process() {
      const raw = inputEl.value;

      if (!raw.trim()) {
        outputEl.value = '';
        statusEl.textContent = '';
        validEl.className = 'validation empty';
        validEl.textContent = 'No input';
        btnCopy.disabled = btnCommit.disabled = true;
        return;
      }

      let parsed;
      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        validEl.className = 'validation err';
        validEl.textContent = e.message;
        outputEl.value = '';
        statusEl.textContent = '';
        btnCopy.disabled = btnCommit.disabled = true;
        return;
      }

      validEl.className = 'validation ok';
      validEl.textContent = 'Valid JSON';

      const mode = document.querySelector('[name="mode"]:checked').value;
      const isJsonMode = mode === 'format' || mode === 'minify';
      let data = (mode === 'format' && sortKeysEl.checked) ? deepSortKeys(parsed) : parsed;
      let result;

      try {
        if (mode === 'format') {
          const indent = indentSel.value === 'tab' ? '\t' : parseInt(indentSel.value, 10);
          result = JSON.stringify(data, null, indent);
        } else if (mode === 'minify') {
          result = JSON.stringify(data);
        } else if (mode === 'yaml') {
          result = jsonToYaml(data);
        } else if (mode === 'xml') {
          result = jsonToXml(data);
        } else if (mode === 'toml') {
          result = jsonToToml(data);
        } else if (mode === 'csv') {
          result = jsonToCsv(data);
        }
      } catch (e) {
        outputEl.value = '';
        statusEl.textContent = '\u26a0 ' + e.message;
        btnCopy.disabled = btnCommit.disabled = true;
        return;
      }

      outputEl.value = result;
      const bytes = new TextEncoder().encode(result).length;
      statusEl.textContent = bytes < 1024
        ? `${bytes} B`
        : `${(bytes / 1024).toFixed(1)} KB`;
      btnCopy.disabled = false;
      btnCommit.disabled = !isJsonMode;
    }

    document.querySelectorAll('[name="mode"]').forEach(r => {
      r.addEventListener('change', () => {
        formatOpts.classList.toggle('hidden', document.querySelector('[name="mode"]:checked').value !== 'format');
        process();
      });
    });

    inputEl.addEventListener('input', process);
    indentSel.addEventListener('change', process);
    sortKeysEl.addEventListener('change', process);

    btnCopy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(outputEl.value);
      } catch {
        outputEl.select();
        document.execCommand('copy');
      }
      const prev = btnCopy.textContent;
      btnCopy.textContent = 'Copied!';
      setTimeout(() => { btnCopy.textContent = prev; }, 1500);
    });

    btnCommit.addEventListener('click', () => {
      inputEl.value = outputEl.value;
      process();
    });

    // ── Persistence ─────────────────────────────────────────────────────────
    const _SK = 'utils-json';
    function _save() {
      try {
        localStorage.setItem(_SK, JSON.stringify({
          input:    inputEl.value,
          mode:     document.querySelector('[name="mode"]:checked').value,
          indent:   indentSel.value,
          sortKeys: sortKeysEl.checked,
        }));
      } catch {}
    }
    (function _load() {
      try {
        const d = JSON.parse(localStorage.getItem(_SK));
        if (!d) return;
        if (d.input    !== undefined) inputEl.value = d.input;
        if (d.mode)  { const r = document.querySelector(`[name="mode"][value="${d.mode}"]`); if (r) { r.checked = true; formatOpts.classList.toggle('hidden', d.mode !== 'format'); } }
        if (d.indent)                 indentSel.value = d.indent;
        if (d.sortKeys !== undefined) sortKeysEl.checked = d.sortKeys;
      } catch {}
      process();
    })();
    inputEl.addEventListener('input', _save);
    indentSel.addEventListener('change', _save);
    sortKeysEl.addEventListener('change', _save);
    document.querySelectorAll('[name="mode"]').forEach(r => r.addEventListener('change', _save));
    btnCommit.addEventListener('click', _save);
  </script>
  <script>
    const SUN_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
    const MOON_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
    const toggleBtn = document.getElementById('theme-toggle');
    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem('utils-theme', theme);
      const isDark = theme === 'dark';
      toggleBtn.innerHTML = isDark ? SUN_SVG : MOON_SVG;
      toggleBtn.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
      toggleBtn.setAttribute('title',      isDark ? 'Switch to light mode' : 'Switch to dark mode');
    }
    toggleBtn.addEventListener('click', () => {
      applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });
    applyTheme(document.documentElement.dataset.theme);
  </script>
</body>
</html>
