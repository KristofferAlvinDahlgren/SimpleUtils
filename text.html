<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text — Utils</title>
  <script>
    (function () {
      const saved = localStorage.getItem('utils-theme');
      const preferred = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = preferred;
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1e1e1e; --surface: #252526; --surface-hover: #2a2d2e;
      --surface-deep: #222222; --input-bg: #2d2d2d;
      --border: #3c3c3c; --accent: #0078d4; --accent-hover: #106ebe;
      --text: #d4d4d4; --text-dim: #888;
      --mono: 'Cascadia Code', Consolas, 'Courier New', monospace;
      --r: 5px; --success: #4ec9b0; --error: #f44747;
    }
    [data-theme="light"] {
      --bg: #f8f8f8; --surface: #ffffff; --surface-hover: #f0f0f0;
      --surface-deep: #ebebeb; --input-bg: #f5f5f5;
      --border: #d0d0d0; --accent: #0078d4; --accent-hover: #106ebe;
      --text: #1f1f1f; --text-dim: #767676;
      --success: #0e7a6e; --error: #c72e2e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: grid; grid-template-rows: auto 1fr; overflow: hidden;
    }
    header {
      display: flex; align-items: center; gap: 16px;
      padding: 0 20px; height: 48px; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header a { color: var(--text-dim); text-decoration: none; font-size: 0.82rem; }
    header a:hover { color: var(--text); }
    header h1 { font-size: 1rem; font-weight: 600; }
    .header-spacer { flex: 1; }
    .theme-toggle {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; padding: 0;
      border: 1px solid var(--border); border-radius: var(--r);
      background: transparent; color: var(--text-dim);
      cursor: pointer; flex-shrink: 0;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .theme-toggle:hover { background: var(--surface-hover); color: var(--text); border-color: var(--accent); }
    .theme-toggle svg { display: block; pointer-events: none; }
    main {
      display: grid; grid-template-columns: 1fr 220px 1fr;
      min-height: 0; overflow: hidden;
    }
    .panel {
      display: flex; flex-direction: column;
      padding: 14px; gap: 10px; min-height: 0; overflow: hidden;
      border-right: 1px solid var(--border);
    }
    .panel:last-child { border-right: none; }
    .label {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-dim); flex-shrink: 0;
    }
    textarea {
      flex: 1; min-height: 0; resize: none;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); color: var(--text);
      font-family: var(--mono); font-size: 0.85rem; line-height: 1.65;
      padding: 10px 12px; outline: none; transition: border-color 0.15s;
    }
    textarea:focus { border-color: var(--accent); }
    textarea[readonly] { background: var(--surface-deep); cursor: default; }
    .options-panel {
      display: flex; flex-direction: column; gap: 16px;
      padding: 14px; overflow-y: auto; min-height: 0;
      border-right: 1px solid var(--border);
    }
    .opt-group { display: flex; flex-direction: column; gap: 8px; }
    .opt-title {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-dim);
      border-bottom: 1px solid var(--border); padding-bottom: 5px;
    }
    .opt-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; font-size: 0.83rem;
    }
    .opt-row label { cursor: pointer; user-select: none; }
    input[type="checkbox"] {
      width: 14px; height: 14px; cursor: pointer;
      accent-color: var(--accent); flex-shrink: 0;
    }
    select {
      background: var(--input-bg); border: 1px solid var(--border); border-radius: var(--r);
      color: var(--text); padding: 3px 6px; font-size: 0.8rem; outline: none; cursor: pointer;
    }
    .opt-input {
      background: var(--input-bg); border: 1px solid var(--border); border-radius: var(--r);
      color: var(--text); padding: 3px 6px; font-size: 0.8rem; outline: none;
      width: 90px; font-family: var(--mono);
    }
    .opt-input:focus { border-color: var(--accent); }
    .status { font-size: 0.73rem; color: var(--text-dim); flex-shrink: 0; min-height: 1em; }
    .action-row { display: flex; gap: 8px; flex-shrink: 0; }
    .btn {
      flex: 1; padding: 7px 0; border-radius: var(--r); border: none;
      font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: background 0.15s, opacity 0.15s;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:not(:disabled):hover { background: var(--accent-hover); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:not(:disabled):hover { background: var(--surface-hover); }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← Utils</a>
    <h1>Text</h1>
    <div class="header-spacer"></div>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme"></button>
  </header>
  <main>
    <div class="panel">
      <span class="label">Input</span>
      <textarea id="input" placeholder="Paste or type text here…" spellcheck="false"></textarea>
    </div>

    <div class="options-panel">
      <div class="opt-group">
        <div class="opt-title">Clean</div>
        <div class="opt-row">
          <label for="opt-trim">Trim whitespace</label>
          <input type="checkbox" id="opt-trim">
        </div>
        <div class="opt-row">
          <label for="opt-empty">Remove empty lines</label>
          <input type="checkbox" id="opt-empty">
        </div>
      </div>

      <div class="opt-group">
        <div class="opt-title">Deduplicate</div>
        <div class="opt-row">
          <label for="opt-dedupe">Remove duplicates</label>
          <input type="checkbox" id="opt-dedupe">
        </div>
        <div class="opt-row">
          <label for="opt-dedupe-case">Case-insensitive</label>
          <input type="checkbox" id="opt-dedupe-case">
        </div>
      </div>

      <div class="opt-group">
        <div class="opt-title">Sort</div>
        <div class="opt-row">
          <label for="opt-sort">Sort lines</label>
          <input type="checkbox" id="opt-sort">
        </div>
        <div class="opt-row">
          <label for="opt-sort-order">Order</label>
          <select id="opt-sort-order">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
          </select>
        </div>
        <div class="opt-row">
          <label for="opt-sort-case">Case-insensitive</label>
          <input type="checkbox" id="opt-sort-case" checked>
        </div>
      </div>

      <div class="opt-group">
        <div class="opt-title">Case</div>
        <div class="opt-row">
          <label for="opt-case">Convert</label>
          <select id="opt-case">
            <option value="none">None</option>
            <option value="lower">Lowercase</option>
            <option value="upper">Uppercase</option>
            <option value="title">Title Case</option>
            <option value="sentence">Sentence</option>
          </select>
        </div>
      </div>

      <div class="opt-group">
        <div class="opt-title">Remove</div>
        <div class="opt-row">
          <label for="opt-accents">Accents</label>
          <input type="checkbox" id="opt-accents">
        </div>
        <div class="opt-row">
          <label for="opt-special">Special characters</label>
          <input type="checkbox" id="opt-special">
        </div>
      </div>

      <div class="opt-group">
        <div class="opt-title">Split / Join</div>
        <div class="opt-row">
          <label for="opt-split-on">Split on</label>
          <input type="text" class="opt-input" id="opt-split-on" placeholder="delimiter">
        </div>
        <div class="opt-row">
          <label for="opt-join-with">Join with</label>
          <input type="text" class="opt-input" id="opt-join-with" placeholder="separator">
        </div>
      </div>

      <div class="opt-group">
        <div class="opt-title">Encode / Decode</div>
        <div class="opt-row">
          <label for="opt-html-entities">HTML entities</label>
          <select id="opt-html-entities">
            <option value="none">None</option>
            <option value="encode">Encode</option>
            <option value="decode">Decode</option>
          </select>
        </div>
        <div class="opt-row">
          <label for="opt-url">URL</label>
          <select id="opt-url">
            <option value="none">None</option>
            <option value="encode">Encode</option>
            <option value="decode">Decode</option>
          </select>
        </div>
      </div>
    </div>

    <div class="panel">
      <span class="label">Output</span>
      <textarea id="output" readonly placeholder="Output appears here…" spellcheck="false"></textarea>
      <div id="status" class="status"></div>
      <div id="details" class="status"></div>
      <div class="action-row">
        <button class="btn btn-ghost" id="btn-copy" disabled>Copy</button>
        <button class="btn btn-primary" id="btn-commit" disabled title="Replace input with output">Commit</button>
      </div>
    </div>
  </main>

  <script>
    const inputEl  = document.getElementById('input');
    const outputEl = document.getElementById('output');
    const statusEl = document.getElementById('status');
    const detailsEl = document.getElementById('details');
    const btnCopy   = document.getElementById('btn-copy');
    const btnCommit = document.getElementById('btn-commit');

    const opts = {
      trim:         document.getElementById('opt-trim'),
      empty:        document.getElementById('opt-empty'),
      dedupe:       document.getElementById('opt-dedupe'),
      dedupeCase:   document.getElementById('opt-dedupe-case'),
      sort:         document.getElementById('opt-sort'),
      sortOrder:    document.getElementById('opt-sort-order'),
      sortCase:     document.getElementById('opt-sort-case'),
      caseConvert:  document.getElementById('opt-case'),
      accents:      document.getElementById('opt-accents'),
      special:      document.getElementById('opt-special'),
      splitOn:      document.getElementById('opt-split-on'),
      joinWith:     document.getElementById('opt-join-with'),
      htmlEntities: document.getElementById('opt-html-entities'),
      url:          document.getElementById('opt-url'),
    };

    function htmlEncode(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function htmlDecode(s) {
      const ta = document.createElement('textarea');
      ta.innerHTML = s;
      return ta.value;
    }

    function process() {
      const raw = inputEl.value;
      let lines = raw.split('\n');
      const inCount = lines.length;

      // Pipeline: trim → remove empty → dedupe → sort → case → remove accents → remove special → split → join → HTML entities → URL
      if (opts.trim.checked)  lines = lines.map(l => l.trim());
      if (opts.empty.checked) lines = lines.filter(l => l.length > 0);
      if (opts.dedupe.checked) {
        const seen = new Set();
        lines = lines.filter(l => {
          const key = opts.dedupeCase.checked ? l.toLowerCase() : l;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }
      if (opts.sort.checked) {
        lines.sort((a, b) => {
          const x = opts.sortCase.checked ? a.toLowerCase() : a;
          const y = opts.sortCase.checked ? b.toLowerCase() : b;
          return x < y ? -1 : x > y ? 1 : 0;
        });
        if (opts.sortOrder.value === 'desc') lines.reverse();
      }
      if (opts.caseConvert.value !== 'none') {
        lines = lines.map(l => {
          switch (opts.caseConvert.value) {
            case 'lower':    return l.toLowerCase();
            case 'upper':    return l.toUpperCase();
            case 'title':    return l.replace(/\S+/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
            case 'sentence': return l.length > 0 ? l.charAt(0).toUpperCase() + l.slice(1).toLowerCase() : l;
          }
          return l;
        });
      }
      if (opts.accents.checked) {
        lines = lines.map(l => l.normalize('NFD').replace(/[\u0300-\u036f]/g, ''));
      }
      if (opts.special.checked) {
        lines = lines.map(l => l.replace(/[^\p{L}\p{N}\s]/gu, ''));
      }
      const splitVal = opts.splitOn.value;
      if (splitVal) {
        lines = lines.flatMap(l => l.split(splitVal));
      }
      const joinVal = opts.joinWith.value;
      if (joinVal) {
        lines = [lines.join(joinVal)];
      }
      if (opts.htmlEntities.value === 'encode') {
        lines = lines.map(htmlEncode);
      } else if (opts.htmlEntities.value === 'decode') {
        lines = lines.map(htmlDecode);
      }
      if (opts.url.value === 'encode') {
        lines = lines.map(l => encodeURIComponent(l));
      } else if (opts.url.value === 'decode') {
        lines = lines.map(l => { try { return decodeURIComponent(l); } catch { return l; } });
      }

      const result = lines.join('\n');
      outputEl.value = result;

      const hasOutput = result.length > 0;
      btnCopy.disabled   = !hasOutput;
      btnCommit.disabled = !hasOutput;

      if (raw.length > 0) {
        const removed = inCount - lines.length;
        statusEl.textContent = `${lines.length} line${lines.length !== 1 ? 's' : ''}` +
          (removed > 0 ? ` (−${removed})` : '');
      } else {
        statusEl.textContent = '';
      }
      if (result.length > 0) {
        const wordCount = result.trim().split(/\s+/).filter(Boolean).length;
        const charCount = result.length;
        const byteCount = new TextEncoder().encode(result).length;
        detailsEl.textContent = `${lines.length} lines · ${wordCount} words · ${charCount} chars · ${byteCount} bytes`;
      } else {
        detailsEl.textContent = '';
      }
    }

    inputEl.addEventListener('input', process);
    Object.values(opts).forEach(el => el.addEventListener('change', process));
    opts.splitOn.addEventListener('input', process);
    opts.joinWith.addEventListener('input', process);

    btnCopy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(outputEl.value);
      } catch {
        outputEl.select();
        document.execCommand('copy');
      }
      const prev = btnCopy.textContent;
      btnCopy.textContent = 'Copied!';
      setTimeout(() => { btnCopy.textContent = prev; }, 1500);
    });

    btnCommit.addEventListener('click', () => {
      inputEl.value = outputEl.value;
      process();
    });
  </script>
  <script>
    const SUN_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
    const MOON_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
    const toggleBtn = document.getElementById('theme-toggle');
    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem('utils-theme', theme);
      const isDark = theme === 'dark';
      toggleBtn.innerHTML = isDark ? SUN_SVG : MOON_SVG;
      toggleBtn.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
      toggleBtn.setAttribute('title',      isDark ? 'Switch to light mode' : 'Switch to dark mode');
    }
    toggleBtn.addEventListener('click', () => {
      applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });
    applyTheme(document.documentElement.dataset.theme);
  </script>
</body>
</html>
