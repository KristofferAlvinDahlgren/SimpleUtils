<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64 — Utils</title>
  <script>
    (function () {
      const saved = localStorage.getItem('utils-theme');
      const preferred = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = preferred;
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1e1e1e; --surface: #252526; --surface-hover: #2a2d2e;
      --surface-deep: #222222; --input-bg: #2d2d2d;
      --border: #3c3c3c; --accent: #0078d4; --accent-hover: #106ebe;
      --text: #d4d4d4; --text-dim: #888;
      --mono: 'Cascadia Code', Consolas, 'Courier New', monospace;
      --r: 5px; --success: #4ec9b0; --error: #f44747;
    }
    [data-theme="light"] {
      --bg: #f8f8f8; --surface: #ffffff; --surface-hover: #f0f0f0;
      --surface-deep: #ebebeb; --input-bg: #f5f5f5;
      --border: #d0d0d0; --accent: #0078d4; --accent-hover: #106ebe;
      --text: #1f1f1f; --text-dim: #767676;
      --success: #0e7a6e; --error: #c72e2e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: grid; grid-template-rows: auto 1fr; overflow: hidden;
    }
    header {
      display: flex; align-items: center; gap: 16px;
      padding: 0 20px; height: 48px; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header a { color: var(--text-dim); text-decoration: none; font-size: 0.82rem; }
    header a:hover { color: var(--text); }
    header h1 { font-size: 1rem; font-weight: 600; }
    .header-spacer { flex: 1; }
    .theme-toggle {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; padding: 0;
      border: 1px solid var(--border); border-radius: var(--r);
      background: transparent; color: var(--text-dim);
      cursor: pointer; flex-shrink: 0;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .theme-toggle:hover { background: var(--surface-hover); color: var(--text); border-color: var(--accent); }
    .theme-toggle svg { display: block; pointer-events: none; }
    main {
      display: grid; grid-template-columns: 1fr 220px 1fr;
      min-height: 0; overflow: hidden;
    }
    .panel {
      display: flex; flex-direction: column;
      padding: 14px; gap: 10px; min-height: 0; overflow: hidden;
      border-right: 1px solid var(--border);
    }
    .panel:last-child { border-right: none; }
    .label {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-dim); flex-shrink: 0;
    }
    textarea {
      flex: 1; min-height: 0; resize: none;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); color: var(--text);
      font-family: var(--mono); font-size: 0.85rem; line-height: 1.65;
      padding: 10px 12px; outline: none; transition: border-color 0.15s;
    }
    textarea:focus { border-color: var(--accent); }
    textarea[readonly] { background: var(--surface-deep); cursor: default; }
    .options-panel {
      display: flex; flex-direction: column; gap: 16px;
      padding: 14px; overflow-y: auto; min-height: 0;
      border-right: 1px solid var(--border);
    }
    .opt-group { display: flex; flex-direction: column; gap: 8px; }
    .opt-title {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-dim);
      border-bottom: 1px solid var(--border); padding-bottom: 5px;
    }
    .opt-row {
      display: flex; align-items: center; gap: 8px; font-size: 0.83rem;
    }
    .opt-row label.radio-label {
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; user-select: none;
    }
    input[type="radio"] {
      width: 14px; height: 14px; cursor: pointer;
      accent-color: var(--accent); flex-shrink: 0;
    }
    .auto-hint {
      font-size: 0.73rem; color: var(--text-dim);
      padding: 5px 8px; background: var(--surface-deep);
      border: 1px solid var(--border); border-radius: var(--r);
      display: none;
    }
    .auto-hint.visible { display: block; }
    .status { font-size: 0.73rem; flex-shrink: 0; min-height: 1em; color: var(--text-dim); }
    .status.err { color: var(--error); }
    .action-row { display: flex; gap: 8px; flex-shrink: 0; }
    .btn {
      flex: 1; padding: 7px 0; border-radius: var(--r); border: none;
      font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: background 0.15s, opacity 0.15s;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:not(:disabled):hover { background: var(--accent-hover); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:not(:disabled):hover { background: var(--surface-hover); }
  </style>
</head>
<body>
  <header>
    <a href="../index.html">← Utils</a>
    <h1>Base64</h1>
    <div class="header-spacer"></div>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme"></button>
  </header>
  <main>
    <div class="panel">
      <span class="label">Input</span>
      <textarea id="input" placeholder="Text to encode, or Base64 to decode…" spellcheck="false"></textarea>
    </div>

    <div class="options-panel">
      <div class="opt-group">
        <div class="opt-title">Operation</div>
        <div class="opt-row">
          <label class="radio-label">
            <input type="radio" name="op" value="encode" checked> Encode
          </label>
        </div>
        <div class="opt-row">
          <label class="radio-label">
            <input type="radio" name="op" value="decode"> Decode
          </label>
        </div>
        <div class="opt-row">
          <label class="radio-label">
            <input type="radio" name="op" value="auto"> Auto-detect
          </label>
        </div>
        <div id="auto-hint" class="auto-hint"></div>
      </div>

      <div class="opt-group">
        <div class="opt-title">Encoding</div>
        <div class="opt-row">
          <label class="radio-label">
            <input type="radio" name="enc" value="standard" checked> Standard
          </label>
        </div>
        <div class="opt-row">
          <label class="radio-label">
            <input type="radio" name="enc" value="urlsafe"> URL-safe
          </label>
        </div>
      </div>
    </div>

    <div class="panel">
      <span class="label">Output</span>
      <textarea id="output" readonly placeholder="Output appears here…" spellcheck="false"></textarea>
      <div id="status" class="status"></div>
      <div class="action-row">
        <button class="btn btn-ghost" id="btn-copy" disabled>Copy</button>
        <button class="btn btn-primary" id="btn-commit" disabled title="Replace input with output">Commit</button>
      </div>
    </div>
  </main>

  <script>
    const inputEl   = document.getElementById('input');
    const outputEl  = document.getElementById('output');
    const statusEl  = document.getElementById('status');
    const autoHint  = document.getElementById('auto-hint');
    const btnCopy   = document.getElementById('btn-copy');
    const btnCommit = document.getElementById('btn-commit');

    function encodeB64(str, urlSafe) {
      const bytes  = new TextEncoder().encode(str);
      const binary = Array.from(bytes, b => String.fromCharCode(b)).join('');
      let b64 = btoa(binary);
      if (urlSafe) b64 = b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
      return b64;
    }

    function decodeB64(b64, urlSafe) {
      if (urlSafe) {
        b64 = b64.replace(/-/g, '+').replace(/_/g, '/');
      }
      // Restore padding
      while (b64.length % 4 !== 0) b64 += '=';
      const binary = atob(b64);
      const bytes  = Uint8Array.from(binary, c => c.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function isLikelyBase64(str) {
      const s = str.trim().replace(/[\r\n\s]/g, '');
      if (!s) return false;
      // URL-safe base64 (no +/ chars, no mandatory padding)
      if (/^[A-Za-z0-9\-_]+=*$/.test(s) && !/^[A-Za-z0-9+/]+=*$/.test(s)) return true;
      // Standard base64 (length must be multiple of 4)
      return /^[A-Za-z0-9+/]+=*$/.test(s) && s.length % 4 === 0;
    }

    function process() {
      const raw = inputEl.value;

      if (!raw.trim()) {
        outputEl.value = '';
        statusEl.textContent = '';
        statusEl.className = 'status';
        autoHint.className = 'auto-hint';
        btnCopy.disabled = btnCommit.disabled = true;
        return;
      }

      const op      = document.querySelector('[name="op"]:checked').value;
      const urlSafe = document.querySelector('[name="enc"]:checked').value === 'urlsafe';
      let actualOp  = op;

      if (op === 'auto') {
        actualOp = isLikelyBase64(raw) ? 'decode' : 'encode';
        autoHint.textContent = `Detected: ${actualOp === 'decode' ? 'Base64 → decoding' : 'plain text → encoding'}`;
        autoHint.className = 'auto-hint visible';
      } else {
        autoHint.className = 'auto-hint';
      }

      try {
        let result;
        if (actualOp === 'encode') {
          result = encodeB64(raw, urlSafe);
        } else {
          const clean = raw.trim().replace(/[\r\n\s]/g, '');
          result = decodeB64(clean, urlSafe);
        }
        outputEl.value = result;
        statusEl.className = 'status';
        statusEl.textContent = `${result.length} chars`;
        btnCopy.disabled = btnCommit.disabled = false;
      } catch (e) {
        outputEl.value = '';
        statusEl.className = 'status err';
        statusEl.textContent = 'Error: ' + (e.message || 'Invalid input');
        btnCopy.disabled = btnCommit.disabled = true;
      }
    }

    inputEl.addEventListener('input', process);
    document.querySelectorAll('[name="op"], [name="enc"]').forEach(el => {
      el.addEventListener('change', process);
    });

    btnCopy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(outputEl.value);
      } catch {
        outputEl.select();
        document.execCommand('copy');
      }
      const prev = btnCopy.textContent;
      btnCopy.textContent = 'Copied!';
      setTimeout(() => { btnCopy.textContent = prev; }, 1500);
    });

    btnCommit.addEventListener('click', () => {
      inputEl.value = outputEl.value;
      process();
    });
  </script>
  <script>
    const SUN_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
    const MOON_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
    const toggleBtn = document.getElementById('theme-toggle');
    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem('utils-theme', theme);
      const isDark = theme === 'dark';
      toggleBtn.innerHTML = isDark ? SUN_SVG : MOON_SVG;
      toggleBtn.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
      toggleBtn.setAttribute('title',      isDark ? 'Switch to light mode' : 'Switch to dark mode');
    }
    toggleBtn.addEventListener('click', () => {
      applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });
    applyTheme(document.documentElement.dataset.theme);
  </script>
</body>
</html>
