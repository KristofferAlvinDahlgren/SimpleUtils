<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password — Utils</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1e1e1e; --surface: #252526; --surface-hover: #2a2d2e;
      --border: #3c3c3c; --accent: #0078d4; --accent-hover: #106ebe;
      --text: #d4d4d4; --text-dim: #888;
      --mono: 'Cascadia Code', Consolas, 'Courier New', monospace;
      --r: 5px; --success: #4ec9b0; --error: #f44747; --warn: #dcdcaa;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: grid; grid-template-rows: auto 1fr; overflow: hidden;
    }
    header {
      display: flex; align-items: center; gap: 16px;
      padding: 0 20px; height: 48px; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header a { color: var(--text-dim); text-decoration: none; font-size: 0.82rem; }
    header a:hover { color: var(--text); }
    header h1 { font-size: 1rem; font-weight: 600; }
    main {
      display: grid; grid-template-columns: 260px 1fr;
      min-height: 0; overflow: hidden;
    }
    .options-panel {
      display: flex; flex-direction: column; gap: 16px;
      padding: 14px; overflow-y: auto; min-height: 0;
      border-right: 1px solid var(--border);
    }
    .panel {
      display: flex; flex-direction: column;
      padding: 14px; gap: 10px; min-height: 0; overflow: hidden;
    }
    .label {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-dim); flex-shrink: 0;
    }
    .opt-group { display: flex; flex-direction: column; gap: 8px; }
    .opt-title {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-dim);
      border-bottom: 1px solid var(--border); padding-bottom: 5px;
    }
    .opt-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; font-size: 0.83rem;
    }
    .opt-row label { cursor: pointer; user-select: none; }
    input[type="checkbox"] {
      width: 14px; height: 14px; cursor: pointer;
      accent-color: var(--accent); flex-shrink: 0;
    }
    /* Length slider */
    .length-row { display: flex; align-items: center; gap: 8px; }
    input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }
    /* Number inputs */
    .num-input {
      width: 52px; background: #2d2d2d; border: 1px solid var(--border);
      border-radius: var(--r); color: var(--text); padding: 4px 6px;
      font-size: 0.82rem; outline: none; text-align: center;
      -moz-appearance: textfield;
    }
    .num-input::-webkit-outer-spin-button,
    .num-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .num-input:focus { border-color: var(--accent); }
    /* Custom chars text input */
    .custom-input {
      width: 100%; background: #2d2d2d; border: 1px solid var(--border);
      border-radius: var(--r); color: var(--text); padding: 5px 8px;
      font-size: 0.8rem; font-family: var(--mono); outline: none;
    }
    .custom-input:focus { border-color: var(--accent); }
    .note { font-size: 0.71rem; color: var(--text-dim); font-family: var(--mono); }
    /* Output */
    .output-header {
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .strength-badge {
      font-size: 0.71rem; font-weight: 600; padding: 2px 8px;
      border-radius: 3px; background: #2a2a2a; border: 1px solid var(--border);
    }
    .password-list {
      flex: 1; min-height: 0; overflow-y: auto;
      display: flex; flex-direction: column; gap: 5px;
    }
    .pw-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--r); flex-shrink: 0;
    }
    .pw-text {
      flex: 1; font-family: var(--mono); font-size: 0.875rem;
      color: var(--text); word-break: break-all; user-select: all;
    }
    .action-row { display: flex; gap: 8px; flex-shrink: 0; }
    .btn {
      flex: 1; padding: 7px 0; border-radius: var(--r); border: none;
      font-size: 0.8rem; font-weight: 500; cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:not(:disabled):hover { background: var(--accent-hover); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:not(:disabled):hover { background: var(--surface-hover); }
    .btn-xs { flex: none; padding: 3px 10px; font-size: 0.72rem; border-radius: 3px; }
    .error-notice {
      font-size: 0.82rem; color: var(--error);
      padding: 12px; text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <a href="../index.html">← Utils</a>
    <h1>Password Generator</h1>
  </header>
  <main>
    <div class="options-panel">

      <div class="opt-group">
        <div class="opt-title">Length</div>
        <div class="length-row">
          <input type="range" id="length-range" min="4" max="128" value="16">
          <input type="number" id="length-num" class="num-input" min="4" max="128" value="16">
        </div>
      </div>

      <div class="opt-group">
        <div class="opt-title">Characters</div>
        <div class="opt-row">
          <label for="use-lower">Lowercase a–z</label>
          <input type="checkbox" id="use-lower" checked>
        </div>
        <div class="opt-row">
          <label for="use-upper">Uppercase A–Z</label>
          <input type="checkbox" id="use-upper" checked>
        </div>
        <div class="opt-row">
          <label for="use-digits">Digits 0–9</label>
          <input type="checkbox" id="use-digits" checked>
        </div>
        <div class="opt-row">
          <label for="use-special">Special !@#$…</label>
          <input type="checkbox" id="use-special" checked>
        </div>
        <input type="text" id="custom-chars" class="custom-input"
               placeholder="Extra characters…" spellcheck="false" autocomplete="off">
      </div>

      <div class="opt-group">
        <div class="opt-title">Options</div>
        <div class="opt-row">
          <label for="readable">Exclude look-alikes</label>
          <input type="checkbox" id="readable">
        </div>
        <div id="lookalike-note" class="note" style="display:none">Excludes: I l 1 O o 0 | `</div>
        <div class="opt-row" style="margin-top:4px">
          <label for="require-all">Require all character sets</label>
          <input type="checkbox" id="require-all" checked>
        </div>
      </div>

      <div class="opt-group">
        <div class="opt-title">Quantity</div>
        <div class="opt-row">
          <label for="count">Count</label>
          <input type="number" id="count" class="num-input" min="1" max="50" value="1">
        </div>
      </div>

    </div>

    <div class="panel">
      <div class="output-header">
        <span class="label">Generated</span>
        <span id="strength-badge" class="strength-badge"></span>
      </div>
      <div id="password-list" class="password-list"></div>
      <div class="action-row">
        <button class="btn btn-ghost" id="btn-copy-all" disabled>Copy All</button>
        <button class="btn btn-primary" id="btn-regen">↻ Regenerate</button>
      </div>
    </div>
  </main>

  <script>
    const LOWER   = 'abcdefghijklmnopqrstuvwxyz';
    const UPPER   = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const DIGITS  = '0123456789';
    const SPECIAL = '!@#$%^&*()-_=+[]{}|;:,.<>?';
    const LOOKALIKES = new Set([...'Il1Oo0|`']);

    function filterLookalikes(str) {
      return [...str].filter(c => !LOOKALIKES.has(c)).join('');
    }

    // Rejection-sampled random index — no modulo bias
    function randIndex(max) {
      const limit = Math.floor(0x100000000 / max) * max;
      const buf = new Uint32Array(1);
      let v;
      do { crypto.getRandomValues(buf); v = buf[0]; } while (v >= limit);
      return v % max;
    }

    function pickChar(pool) {
      return pool[randIndex(pool.length)];
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = randIndex(i + 1);
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildSets() {
      const readable = document.getElementById('readable').checked;
      const apply    = s => readable ? filterLookalikes(s) : s;
      const sets     = [];

      if (document.getElementById('use-lower').checked)   sets.push(apply(LOWER));
      if (document.getElementById('use-upper').checked)   sets.push(apply(UPPER));
      if (document.getElementById('use-digits').checked)  sets.push(apply(DIGITS));
      if (document.getElementById('use-special').checked) sets.push(apply(SPECIAL));

      const custom = document.getElementById('custom-chars').value;
      if (custom) sets.push(apply([...new Set(custom)].join('')));

      return sets.filter(s => s.length > 0);
    }

    function generate() {
      const sets       = buildSets();
      const length     = Math.max(4, Math.min(128, parseInt(lengthNum.value, 10)  || 16));
      const count      = Math.max(1, Math.min(50,  parseInt(countEl.value,   10)  || 1));
      const requireAll = document.getElementById('require-all').checked;
      const list       = document.getElementById('password-list');
      const badge      = document.getElementById('strength-badge');

      list.innerHTML = '';

      if (sets.length === 0) {
        list.insertAdjacentHTML('beforeend',
          '<div class="error-notice">Select at least one character set.</div>');
        badge.textContent = '';
        btnCopyAll.disabled = true;
        return;
      }

      // Deduplicated pool used for fill characters
      const pool = [...new Set(sets.join(''))].join('');

      const passwords = [];
      for (let p = 0; p < count; p++) {
        const chars = [];

        // Guarantee at least one character from each active set
        if (requireAll) {
          for (const s of sets) {
            if (chars.length < length) chars.push(pickChar(s));
          }
        }

        // Fill remaining positions from the combined pool
        while (chars.length < length) chars.push(pickChar(pool));

        passwords.push(shuffle(chars).join(''));
      }

      // Render password rows
      for (const pw of passwords) {
        const row  = document.createElement('div');
        row.className = 'pw-row';

        const text = document.createElement('span');
        text.className = 'pw-text';
        text.textContent = pw;

        const btn = document.createElement('button');
        btn.className = 'btn btn-ghost btn-xs';
        btn.textContent = 'Copy';
        btn.addEventListener('click', async () => {
          try { await navigator.clipboard.writeText(pw); } catch { /* unavailable */ }
          btn.textContent = '✓';
          setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
        });

        row.append(text, btn);
        list.appendChild(row);
      }

      // Entropy: bits = length × log₂(pool size)
      const bits = Math.round(length * Math.log2(pool.length));
      const [label, color] =
        bits < 40  ? ['Weak',        'var(--error)']   :
        bits < 60  ? ['Fair',        'var(--warn)']    :
        bits < 80  ? ['Good',        'var(--success)'] :
        bits < 100 ? ['Strong',      'var(--success)'] :
                     ['Very strong', '#89d185'];

      badge.textContent = `~${bits} bits · ${label}`;
      badge.style.color = color;
      btnCopyAll.disabled = false;
    }

    // Element references
    const lengthRange = document.getElementById('length-range');
    const lengthNum   = document.getElementById('length-num');
    const countEl     = document.getElementById('count');
    const readableEl  = document.getElementById('readable');
    const btnCopyAll  = document.getElementById('btn-copy-all');

    // Length slider ↔ number input sync
    lengthRange.addEventListener('input', () => {
      lengthNum.value = lengthRange.value;
      generate();
    });
    lengthNum.addEventListener('input', () => {
      const v = Math.max(4, Math.min(128, parseInt(lengthNum.value, 10) || 16));
      lengthRange.value = v;
      generate();
    });

    // Show/hide look-alike note
    readableEl.addEventListener('change', () => {
      document.getElementById('lookalike-note').style.display =
        readableEl.checked ? 'block' : 'none';
      generate();
    });

    // All other option changes
    ['use-lower', 'use-upper', 'use-digits', 'use-special', 'require-all']
      .forEach(id => document.getElementById(id).addEventListener('change', generate));
    countEl.addEventListener('input', generate);
    document.getElementById('custom-chars').addEventListener('input', generate);

    document.getElementById('btn-regen').addEventListener('click', generate);

    btnCopyAll.addEventListener('click', async () => {
      const texts = [...document.querySelectorAll('.pw-text')].map(el => el.textContent);
      try { await navigator.clipboard.writeText(texts.join('\n')); } catch { /* unavailable */ }
      btnCopyAll.textContent = 'Copied!';
      setTimeout(() => { btnCopyAll.textContent = 'Copy All'; }, 1500);
    });

    // Generate on load
    generate();
  </script>
</body>
</html>
